<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your accent</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Before the first paint: the window says light or dark in the query; without it the system's.
      {
        const theme = new URLSearchParams(location.search).get("theme");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      }
    </script>
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <h1 id="heading">Your accent</h1>
        <button type="button" class="btn quiet" id="refresh" title="Read your profile again">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" />
          </svg>
          Refresh
        </button>
      </header>
      <div class="tabs" role="tablist" aria-label="Your accent">
        <button type="button" role="tab" class="tab" id="tab-profile" aria-controls="profile-view" aria-selected="true">
          Your profile
        </button>
        <button type="button" role="tab" class="tab" id="tab-flags" aria-controls="flags-view" aria-selected="false">
          Check your flags
        </button>
      </div>
      <section id="profile-view" role="tabpanel" aria-labelledby="tab-profile">
        <p class="note" id="note">
          Measured over many sentences, not word by word: one word can sound off by chance, a
          pattern over many cannot.
        </p>
        <div id="body" aria-live="polite">
          <p class="state" id="loading">Reading your profile…</p>
        </div>
      </section>
      <section id="flags-view" role="tabpanel" aria-labelledby="tab-flags" hidden>
        <div class="job">
          <div class="job-buttons">
            <button type="button" class="btn primary" id="score" disabled>Score my last 200 sentences</button>
            <button type="button" class="btn" id="cancel" disabled>Cancel</button>
            <button type="button" class="btn quiet" id="reset" disabled title="Clear every Right and Wrong you marked, and the Not a mistake tally">
              Reset marks
            </button>
          </div>
          <p class="job-line" id="job-line" aria-live="polite">Reading your flags…</p>
          <p class="note" id="sensitivity-line"></p>
          <div class="progress" id="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
        <div id="flags-body"></div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
